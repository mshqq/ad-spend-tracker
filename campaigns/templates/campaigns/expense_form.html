{% extends "base.html" %}
{% block title %}Расход · Ad Spend Tracker{% endblock %}
{% block content %}
  <section class="form-page">
    <h1>{% if object %}Изменить расход{% else %}Добавить расход{% endif %}</h1>
    <p class="muted">Кампания: {{ campaign.name }}</p>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="actions"><button type="submit">Сохранить расход</button><a href="{% url 'campaigns:detail' campaign.pk %}">Отмена</a></div>
    </form>
  </section>
{% endblock %}
